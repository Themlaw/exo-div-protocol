# Durcissement applique a tous les services : on part du principe qu'un attaquant
# finira dans un conteneur, et on cherche a ce qu'il n'y trouve rien a faire.
#
# Ce fichier vit dans `infra/`, avec le reste de ce qui deploie. Consequence a
# connaitre : Docker Compose resout les chemins relatifs depuis le repertoire du
# FICHIER, d'ou les `../` — le contexte de construction et les montages designent
# tous la racine du depot. Ne pas les reecrire en `./` en croyant les simplifier.
#
# Chaque service tourne en 1000:1000 (jamais root), avec un systeme de fichiers
# racine en lecture seule, toutes les capabilities Linux retirees, et l'interdiction
# d'acquerir de nouveaux privileges — ce qui neutralise l'escalade par binaire suid.
#
# Les repertoires de ./data doivent appartenir a 1000:1000 AVANT le premier
# demarrage : un volume nomme serait cree root et le conteneur non-root ne
# pourrait pas y ecrire. C'est install.sh qui les cree avec le bon proprietaire.

name: portail-depot

services:
  postgres:
    # Version epinglee au correctif : `17-alpine` glisserait d'un `docker pull` a l'autre.
    image: postgres:17.11-alpine
    restart: unless-stopped
    # L'uid de CELUI QUI A LANCE install.sh, et non un 1000 fige. Les
    # repertoires sous ./data sont crees par ce script, donc lui appartiennent :
    # un conteneur qui ecrit dedans doit porter le meme uid, sinon il se heurte a
    # un refus de permission que rien sur la machine ne peut reparer sans root.
    # Le defaut a 1000 sert au cas ou compose est lance sans passer par le
    # script. La propriete de securite reste entiere — install.sh refuse de
    # tourner en root, l'uid n'est donc jamais 0.
    user: "${SERVICE_UID:-1000}:${SERVICE_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Sous-repertoire explicite : initdb refuse un repertoire de donnees
      # contenant deja quoi que ce soit, y compris un point de montage.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    tmpfs:
      # Les seuls chemins que Postgres doit ecrire hors de PGDATA. `noexec` et
      # `nosuid` empechent d'y deposer puis d'y executer un binaire.
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      # Postgres ne touche QUE `datastore`. Il n'est joignable par rien d'autre
      # que l'application et le worker, et Traefik lui-meme ne peut pas l'atteindre.
      - datastore

  minio:
    # Dernier RELEASE publie. Jamais `latest` : l'image du serveur doit etre
    # exactement celle qu'on a testee en local.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    user: "${SERVICE_UID:-1000}:${SERVICE_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Le navigateur poste les octets DIRECTEMENT ici : sans autorisation
      # d'origine, le POST pre-signe est bloque par le navigateur et l'upload
      # direct ne marche pas du tout. Une seule origine, celle du portail —
      # `*` autoriserait n'importe quelle page a poster avec une policy volee.
      # Le client JS de MinIO n'expose pas `setBucketCors` : la configuration
      # se fait donc ici, cote serveur, et non depuis l'application.
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_BASE_URL}
      # Cible de notification `portail`, d'ou l'ARN `arn:minio:sqs::portail:webhook`
      # auquel l'application abonne la quarantaine au demarrage. Sans elle, MinIO
      # refuserait l'abonnement et aucun scan ne partirait a l'arrivee d'un objet.
      MINIO_NOTIFY_WEBHOOK_ENABLE_portail: "on"
      # HORS du prefixe versionne, et c'est voulu : les sondes et ce webhook sont
      # des surfaces d'exploitation, pas l'API du produit. Un passage en v2
      # casserait sinon la notification MinIO pour aucun benefice. Le chemin est
      # celui de ROUTES_SERVED_OUTSIDE_THE_VERSIONED_API.
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_portail: "http://app:${PORT:-3000}/internal/storage/events"
      # Le meme secret que l'application attend en en-tete Authorization : MinIO
      # ne signe pas le corps de ses notifications, ce jeton est la seule preuve
      # que l'appel vient bien du stockage.
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_portail: ${INTERNAL_STORAGE_WEBHOOK_SECRET}
      # File sur disque : une notification emise pendant que l'API redemarre est
      # gardee et rejouee, au lieu d'etre perdue. Sans elle, MinIO exige aussi que
      # la cible reponde des SON demarrage, ce qui rendrait l'ordre de lancement
      # des services significatif.
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_portail: /data/.notifications
      MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT_portail: "10000"
    volumes:
      - ../data/minio:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - datastore
      # MinIO doit etre joignable par le NAVIGATEUR : on a choisi l'upload
      # pre-signe direct, les octets ne passent pas par l'API. Il rejoint donc
      # `proxied` pour que Traefik puisse le router — sans y gagner d'acces
      # sortant, puisque ce reseau est lui aussi interne.
      - proxied

  clamav:
    # clamd, joint en TCP par le worker. L'image officielle embarque deja un jeu
    # de signatures : le service repond des le premier demarrage, sans attendre
    # un telechargement.
    #
    # A SAVOIR AVANT DE DEPLOYER : clamd charge toute la base de signatures en
    # memoire et reclame environ 1,5 Go rien pour demarrer. Sur une VM plus
    # petite il est tue par le noyau, et le fail closed transforme alors chaque
    # depot en scan qui ne finit jamais.
    image: clamav/clamav:1.5.1
    restart: unless-stopped
    # SEULE exception au 1000:1000 de tous les autres services, et la regle
    # qu'elle sert reste tenue : ce n'est pas root. L'image cree ses repertoires
    # avec `install -o clamav -g clamav`, ce qu'aucun autre uid ne peut faire, et
    # elle embarque son propre compte non privilegie — le forcer a 1000
    # empechait simplement clamd de demarrer.
    user: "100:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Les signatures survivent au conteneur : sans persistance, chaque
      # redemarrage repartirait du jeu fige dans l'image et retelechargerait tout.
      #
      # Volume NOMME et non un bind sous ./data, contrairement a Postgres et
      # MinIO : Docker en herite le proprietaire du repertoire de l'image, donc
      # l'uid 100, la ou un bind exigerait un chown de l'hote. Le cout est
      # acceptable parce que ce contenu est un CACHE — il se retelecharge — et
      # non une donnee de client.
      - clamav_signatures:/var/lib/clamav
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m,uid=100,gid=101
      # Les journaux vont en memoire et disparaissent avec le conteneur : les
      # verdicts qui comptent sont ecrits par NOUS, dans nos propres journaux.
      # clamd refuse simplement de demarrer s'il ne peut pas ouvrir les siens.
      - /var/log/clamav:rw,noexec,nosuid,size=32m,uid=100,gid=101
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Le chargement des signatures prend une bonne minute : une fenetre courte
      # ferait redemarrer le service en boucle avant qu'il ait fini de demarrer.
      start_period: 180s
    networks:
      - datastore
      # SEUL service a sortir sur Internet, et c'est un choix assume : un
      # antivirus dont les signatures datent de l'image ne protege plus de
      # grand-chose. Il ne partage ce reseau avec personne, donc aucun autre
      # conteneur ne regagne d'acces sortant par ce biais.
      - signatures

  prometheus:
    # Majeure courante, epinglee au correctif comme tout le reste.
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    user: "${SERVICE_UID:-1000}:${SERVICE_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Trente jours : de quoi comparer un incident a la semaine precedente sans
      # faire de ce conteneur un entrepot de donnees.
      - --storage.tsdb.retention.time=30d
      # PAS de --web.enable-lifecycle ni de --web.enable-admin-api : ils
      # ouvrent l'arret du service et l'effacement des series a qui atteint le
      # port. Rien ici n'a besoin de recharger a chaud.
      - --web.listen-address=:9090
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # Le secret de collecte n'est jamais dans un fichier versionne : install.sh
      # l'ecrit a partir de l'environnement, avec les droits 0400.
      - ../data/observability/secrets:/etc/prometheus/secrets:ro
      - ../data/prometheus:/prometheus
    networks:
      # UNIQUEMENT le reseau d'observabilite. Le collecteur n'a aucune raison
      # d'atteindre Postgres ni clamav, et le lui interdire supprime la question.
      - observability

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    user: "${SERVICE_UID:-1000}:${SERVICE_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Genere aleatoirement par install.sh, comme tous les autres secrets.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Aucune inscription, aucun acces anonyme : le tableau de bord dit le
      # rythme des depots et celui des refus, ce n'est pas une page publique.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana genere ses liens absolus a partir de cette valeur : sans elle,
      # une connexion derriere le proxy renvoie vers localhost.
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Le conteneur n'a aucun acces sortant (reseau interne) : lui demander
      # d'aller chercher des mises a jour ou des greffons ne ferait qu'echouer
      # bruyamment a chaque demarrage.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Grafana 12 pre-installe trois greffons depuis grafana.com au demarrage.
      # Sans acces sortant, ce sont quatre erreurs a CHAQUE boot — et un
      # conteneur qui crie tous les matins apprend a tout le monde a ne plus
      # lire ses journaux.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../data/grafana:/var/lib/grafana
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - observability
      # Rejoint `proxied` pour que Traefik le serve en HTTPS. Une stack
      # d'alerting qu'on ne peut pas montrer ne prouve rien — mais elle reste
      # derriere l'authentification de Grafana, jamais anonyme.
      - proxied

  app:
    # Reste en 1000:1000 la ou les services a donnees suivent l'uid appelant :
    # celui-ci n'ecrit dans aucun repertoire de l'hote — il ne possede que les
    # fichiers de son image, et un tmpfs pour le reste.
    #
    # TIREE, jamais construite ici : ce fichier est celui du deploiement, et une
    # image publiee est la seule qui ait passe la chaine de verification. La
    # construction locale vit dans la surcouche de developpement.
    image: ${IMAGE_REPOSITORY:-ghcr.io/themlaw/exo-div-protocol}/portail-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Pas fige a `production` : sur une machine locale il n'y a ni nom
      # d'hote public ni TLS, et l'application REFUSE de demarrer en
      # production sur une URL en clair — a raison, le cookie de session ne
      # pourrait pas y etre pose en Secure. install.sh tranche selon le nom
      # d'hote saisi.
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ACCESS_LINK_TOKEN_PEPPER: ${ACCESS_LINK_TOKEN_PEPPER}
      INTERNAL_STORAGE_WEBHOOK_SECRET: ${INTERNAL_STORAGE_WEBHOOK_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      # L'adresse par laquelle le NAVIGATEUR joint le stockage. Une URL
      # pre-signee en GET signe l'hote : signee sur `minio:9000`, elle rendrait
      # 403 des que le navigateur la presente au proxy.
      MINIO_PUBLIC_ENDPOINT: ${PUBLIC_BASE_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CLAMAV_ENDPOINT: ${CLAMAV_ENDPOINT}
      DEMO_LAWYER_EMAIL: ${DEMO_LAWYER_EMAIL}
      DEMO_LAWYER_PASSWORD: ${DEMO_LAWYER_PASSWORD}
      DEMO_ACCESS_LINK_TOKEN: ${DEMO_ACCESS_LINK_TOKEN}
      DEMO_ACCESS_PIN: ${DEMO_ACCESS_PIN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Un seul relais de confiance : Traefik. Le proxy frontal de la machine
      # passe le 443 en TLS, il ne reecrit pas l'en-tete.
      TRUSTED_PROXY_HOP_COUNT: ${TRUSTED_PROXY_HOP_COUNT:-1}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # `node` plutot que `curl` : l'image d'execution ne porte aucun client
      # HTTP, et en installer un pour la seule sonde ajouterait une surface a
      # ce qui doit en avoir le moins possible.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - proxied
      - datastore
      # Prometheus collecte /metrics : sans ce reseau, la cible reste `down` et
      # les alertes se declenchent sur une application parfaitement saine.
      - observability

  worker:
    # LA MEME image que l'application, un point d'entree different : le worker
    # partage tout le domaine — statuts, journal, stockage — et deux images
    # divergeraient au premier correctif applique d'un seul cote.
    image: ${IMAGE_REPOSITORY:-ghcr.io/themlaw/exo-div-protocol}/portail-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "dist/worker_main"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ACCESS_LINK_TOKEN_PEPPER: ${ACCESS_LINK_TOKEN_PEPPER}
      INTERNAL_STORAGE_WEBHOOK_SECRET: ${INTERNAL_STORAGE_WEBHOOK_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${PUBLIC_BASE_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CLAMAV_ENDPOINT: ${CLAMAV_ENDPOINT}
      DEMO_LAWYER_EMAIL: ${DEMO_LAWYER_EMAIL}
      DEMO_LAWYER_PASSWORD: ${DEMO_LAWYER_PASSWORD}
      DEMO_ACCESS_LINK_TOKEN: ${DEMO_ACCESS_LINK_TOKEN}
      DEMO_ACCESS_PIN: ${DEMO_ACCESS_PIN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      TRUSTED_PROXY_HOP_COUNT: ${TRUSTED_PROXY_HOP_COUNT:-1}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      # JAMAIS `proxied` : le worker n'expose aucune route publique, et Traefik
      # n'a rien a lui demander. Son port de metriques ne vit que sur le reseau
      # d'observabilite.
      - datastore
      - observability

  web:
    image: ${IMAGE_REPOSITORY:-ghcr.io/themlaw/exo-div-protocol}/portail-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      # nginx ecrit son pid et ses corps de requete temporaires : sans ces deux
      # chemins il refuse de demarrer en lecture seule.
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxied

  traefik:
    image: traefik:v3.5.3
    restart: unless-stopped
    user: "${SERVICE_UID:-1000}:${SERVICE_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      # TOUTE la configuration statique en arguments, et le routage dynamique
      # dans un fichier monte : c'est ce qui permet de NE PAS monter le socket
      # Docker. Donner le socket a un service expose sur Internet est exactement
      # ce qu'un relecteur releve dans un exercice de securite.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # 8000/8443 et non 80/443 : un port sous 1024 exigerait
      # CAP_NET_BIND_SERVICE, que cette pile abandonne partout.
      - --entryPoints.web.address=:8000
      - --entryPoints.websecure.address=:8443
      # Aucune redirection http -> https declaree ICI : elle vaudrait pour
      # toutes les installations, or une installation locale n'a pas de HTTPS
      # vers lequel rediriger — aucune autorite ne certifie `localhost`. Elle
      # est rendue par install.sh dans le routage dynamique, ou elle peut
      # dependre du nom d'hote.
      - --entryPoints.metrics.address=:8082
      - --metrics.prometheus.entryPoint=metrics
      # Sans ce drapeau, Traefik n'expose que l'entrypoint et le service : on
      # verrait « 12 reponses 502 sur websecure » sans savoir si c'est l'API, le
      # stockage ou Grafana. Le routeur est justement la dimension qui distingue
      # les quatre. Le cout en cardinalite est de quatre routeurs par code de
      # reponse, ce qui ne se compare pas a une etiquette portant un chemin.
      - --metrics.prometheus.addRoutersLabels=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Staging par defaut : le quota de certificats est par domaine et par
      # semaine, et ce domaine est PARTAGE entre les candidats. Basculer en
      # production se fait en vidant ACME_CA_SERVER, une fois que tout marche.
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
    volumes:
      - ../data/traefik/dynamic:/etc/traefik/dynamic:ro
      # acme.json doit etre en 0600 et PERSISTANT : sans persistance, Traefik
      # redemande un certificat a chaque redeploiement et brule le quota.
      - ../data/traefik/acme:/acme
    ports:
      # Le proxy frontal de la machine relaie le sous-domaine vers ces deux
      # ports. Sur 127.0.0.1 uniquement : rien ne doit etre joignable depuis
      # l'exterieur autrement que par lui.
      - "127.0.0.1:${TRAEFIK_HTTP_PORT}:8000"
      - "127.0.0.1:${TRAEFIK_HTTPS_PORT}:8443"
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      # SEUL service attache a un reseau non interne : c'est ce qui fait de lui
      # le pont unique vers l'exterieur.
      - edge
      - proxied
      # Traefik est le seul a voir ce que l'exterieur envoie VRAIMENT : codes de
      # reponse par routeur, latence, connexions ouvertes, certificats. Sans ce
      # reseau, son entrypoint `metrics` existerait sans que personne ne le lise,
      # et une panne visible du dehors ne le serait d'aucune de nos series.
      - observability

volumes:
  clamav_signatures:

networks:
  # Seul Traefik sera attache a `edge`. C'est ce qui fait de lui le pont unique
  # vers l'exterieur : les services qu'il route restent sur des reseaux internes
  # et n'ont, eux, aucun acces sortant.
  edge:
    driver: bridge

  # Traefik + les services publiquement routes (application, MinIO).
  # `internal: true` : porter du trafic conteneur a conteneur n'exige pas de
  # passerelle. Traefik atteint ces services, eux n'atteignent pas Internet.
  proxied:
    internal: true

  # Reserve a clamav, pour freshclam et rien d'autre.
  signatures:
    driver: bridge

  # Le collecteur, le tableau de bord, et les cibles qu'ils interrogent. Separe
  # de `datastore` pour que l'observabilite ne devienne pas un chemin de plus
  # vers la base : Prometheus n'a besoin que des deux processus du portail.
  observability:
    internal: true

  datastore:
    # `internal: true` coupe tout acces sortant vers Internet. Ni Postgres ni
    # MinIO n'ont de raison d'appeler l'exterieur ; leur en retirer le moyen
    # supprime l'exfiltration directe depuis un conteneur compromis.
    #
    # Consequence a connaitre : Docker **ne peut pas publier de port** pour un
    # conteneur attache au seul reseau interne — il n'y a ni passerelle ni NAT —
    # et il ignore la directive `ports` en silence. Aucun port n'est donc publie
    # ici. Pour un acces depuis l'hote en developpement, utiliser
    # `infra/docker-compose.dev.yml`.
    internal: true

# Topologie a l'arrivee des services restants :
#
#   traefik    -> edge + proxied                 (seul pont vers l'exterieur)
#   app        -> proxied + datastore + observability
#   worker     -> datastore + observability      (jamais expose, meme via Traefik :
#                                                 son port de metriques n'est joignable
#                                                 que par le collecteur)
#   clamav     -> datastore + signatures         (joignable par le worker, sort pour freshclam)
#   minio      -> proxied + datastore            (routable, car upload direct navigateur)
#   postgres   -> datastore                      (joignable par rien d'autre)
#   prometheus -> observability                  (ne voit ni la base ni le scanner)
#   grafana    -> observability + proxied        (route par Traefik, authentifie)
