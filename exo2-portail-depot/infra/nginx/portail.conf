# Configuration COMPLETE et non un simple bloc `server` : c'est elle qui deplace
# le pid et les repertoires temporaires hors de `/var`, seule facon de servir le
# front avec `read_only: true` et sans jamais passer root.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    # 8080 et non 80 : un port sous 1024 exigerait CAP_NET_BIND_SERVICE, que
    # tous les conteneurs de cette pile abandonnent.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les entetes de securite sont poses par Traefik pour TOUTE la surface, y
    # compris les reponses de l'API : les redire ici les dedoublerait.

    location /assets/ {
      # Les noms de fichiers portent une empreinte : une reponse mise en cache
      # pour un an ne peut pas devenir perimee, elle peut seulement cesser
      # d'etre demandee.
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / {
      # Le repli sur `index.html` fait vivre les routes du client : un lien de
      # depot colle dans un mail est ouvert directement sur `/deposit/<jeton>`,
      # que le serveur ne connait pas comme fichier.
      try_files $uri $uri/ /index.html;
      # L'index ne doit JAMAIS etre mis en cache : c'est lui qui nomme les
      # empreintes des assets, et un index perime demande des fichiers disparus.
      add_header Cache-Control "no-store";
    }
  }
}
