# La verification de exo2-portail-depot. Tous les chemins sont prefixes par le
# nom de son dossier : dans un monorepo, GitHub n'execute que les workflows de
# `.github/workflows/` a la RACINE, et le repertoire de travail par defaut est
# celui du depot entier.
#
# Un job par nature de verification, et pas un seul job « tests » : les suites
# unitaires rendent leur verdict en une minute, les suites qui demandent
# Postgres, MinIO et clamav en demandent plusieurs. Les separer donne le retour
# rapide tout de suite, au lieu de le faire attendre derriere le plus lent.
name: Verification exo2

on:
  # Volontairement SANS filtre de chemins. Un filtre `paths` s'applique aussi aux
  # poussees d'etiquettes, ou il se compare au diff du commit : une etiquette
  # `v1.2.3` posee sur un commit qui ne touche pas exo2 ne declencherait alors
  # rien, et la version ne serait jamais publiee — en silence. Le prix a payer
  # est une verification de trop quand seul exo1 bouge, et exo1 est termine.
  push:
    branches: [main]
    # Une etiquette `v1.2.3` publie les images sous `1.2.3` en plus de `latest` :
    # c'est ce qui permet d'epingler une version connue et d'y revenir.
    tags: ['v*']
  pull_request:
    paths:
      - 'exo2-portail-depot/**'
      - '.github/workflows/ci.yml'

# Un push qui en remplace un autre annule la verification en cours : ce depot
# n'a aucune raison de payer deux fois pour un commit deja depasse.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # La version EXACTE de l'image de production. Verifier sur une autre reviendrait
  # a ne rien verifier du tout.
  NODE_VERSION: "24.11.0"

jobs:
  backend:
    name: Backend — analyse statique et tests unitaires
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: exo2-portail-depot/backend/package-lock.json

      - run: npm ci
        working-directory: exo2-portail-depot/backend

      - run: npm run lint
        working-directory: exo2-portail-depot/backend

      - name: Tests unitaires
        working-directory: exo2-portail-depot/backend
        # Le meme drapeau que dans package.json : Jest execute des modules ES,
        # et sans lui les fichiers de test ne sont meme pas charges.
        run: NODE_OPTIONS=--experimental-vm-modules npx jest --ci

  frontend:
    name: Front — types, derive des contrats et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: exo2-portail-depot/frontend/package-lock.json

      - run: npm ci
        working-directory: exo2-portail-depot/frontend

      # Le `typecheck` du front comprend le test de derive des contrats, qui
      # compile les sources du BACKEND : sans ses dependances, le compilateur ne
      # resout pas `drizzle-orm` et rend des centaines de fausses erreurs.
      - name: Dependances du backend, pour la derive des contrats
        run: npm ci --ignore-scripts
        working-directory: exo2-portail-depot/backend

      - run: npm run typecheck
        working-directory: exo2-portail-depot/frontend

      - run: npx vitest run
        working-directory: exo2-portail-depot/frontend

  integration:
    name: Backend — tests d'integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: exo2-portail-depot/backend/package-lock.json

      - run: npm ci
        working-directory: exo2-portail-depot/backend

      - name: Postgres, MinIO et clamav
        working-directory: exo2-portail-depot
        run: ./infra/ci/prepare_test_environment.sh

      - name: Tests d'integration
        working-directory: exo2-portail-depot/backend
        run: |
          set -a
          . ../.env
          set +a
          NODE_OPTIONS=--experimental-vm-modules npx jest --ci --config ./test/jest-integration.json

      - name: Journaux des services en cas d'echec
        if: failure()
        working-directory: exo2-portail-depot
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml logs --tail 200

  bout_en_bout:
    name: Parcours complets (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Les DEUX verrous : ce travail installe les deux projets, et ne
          # nommer que l'un ferait porter le cache sur une empreinte qui ne
          # change pas quand l'autre bouge.
          cache-dependency-path: |
            exo2-portail-depot/backend/package-lock.json
            exo2-portail-depot/frontend/package-lock.json

      - run: npm ci
        working-directory: exo2-portail-depot/backend

      - run: npm ci
        working-directory: exo2-portail-depot/frontend

      # Chromium seul : les trois scenarios de bureau et celui de mobile
      # tournent tous dessus, et telecharger Firefox et WebKit pour rien
      # ajouterait plusieurs minutes a chaque verification.
      - name: Navigateur
        run: npx playwright install --with-deps chromium
        working-directory: exo2-portail-depot/frontend

      - name: Postgres, MinIO et clamav
        working-directory: exo2-portail-depot
        run: ./infra/ci/prepare_test_environment.sh

      # L'API, le worker et le serveur Vite sont demarres par la configuration
      # Playwright elle-meme : un scenario qui ne peut pas demarrer sa propre
      # pile n'est pas rejouable sur un poste.
      - name: Scenarios
        run: npx playwright test
        working-directory: exo2-portail-depot/frontend

      - name: Rapport en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            exo2-portail-depot/frontend/playwright-report
            exo2-portail-depot/frontend/test-results
          retention-days: 7

  observabilite:
    name: Observabilite — regles d'alerte
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Une regle d'alerte est du code qui ne s'execute qu'au moment de la panne :
      # personne ne remarque qu'elle est muette tant qu'il ne se passe rien. Ces
      # cas la font parler sur des series synthetiques, et exigent son silence sur
      # le fonctionnement normal. La version de promtool est celle de l'image
      # deployee : verifier sur une autre reviendrait a ne rien verifier.
      - name: Regles d'alerte
        run: |
          docker run --rm --volume "${{ github.workspace }}/exo2-portail-depot/observability/prometheus:/regles:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 check rules /regles/alert_rules.yml
          docker run --rm --volume "${{ github.workspace }}/exo2-portail-depot/observability/prometheus:/regles:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 test rules /regles/alert_rules_test.yml

  images:
    name: Images de deploiement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Construites sans etre publiees, et sans attendre les suites de tests :
      # la question a laquelle ce job repond est « le deploiement compile-t-il
      # encore », et elle merite une reponse en quelques minutes sur une
      # proposition de fusion. L'image du front echoue si les contrats ont
      # derive. La publication, elle, est un autre job et attend les tests.
      - name: Image de l'application
        uses: docker/build-push-action@v6
        with:
          context: exo2-portail-depot
          file: exo2-portail-depot/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image du front
        uses: docker/build-push-action@v6
        with:
          context: exo2-portail-depot
          file: exo2-portail-depot/frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publication:
    name: Publication des images sur GHCR
    runs-on: ubuntu-24.04
    # Jamais sur une proposition de fusion : `latest` doit designer ce que la
    # branche principale contient, pas la derniere branche qui a ete poussee.
    if: github.event_name == 'push'
    # Une image publiee est celle que `install.sh` deploiera sans rien
    # reconstruire : elle ne doit exister que si TOUTE la chaine est verte.
    # Publier d'abord et verifier ensuite reviendrait a livrer le defaut.
    needs: [backend, frontend, integration, bout_en_bout, observabilite, images]
    permissions:
      contents: read
      # Le seul droit ajoute, et il expire avec le job. C'est la raison du choix
      # de GHCR : aucun jeton de longue duree ne dort dans les secrets du depot.
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Authentification au registre
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom du depot peut porter des majuscules, jamais le nom d'une image :
      # le registre refuserait la reference. Les images s'appellent `portail-app`
      # et `portail-web` : dans un depot qui porte deux exercices, `app` ne
      # dirait pas de quoi il s'agit.
      - name: Nom des images
        id: noms
        run: echo "prefixe=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # `latest` sur la branche principale, plus le numero de version quand
      # l'etiquette en porte un. Le commit exact n'est PAS une etiquette de plus
      # — il voyage dans le label `revision`, ou il repond a « quel code tourne
      # dans cette image » sans encombrer la liste des versions.
      - name: Etiquettes
        id: metadonnees
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.noms.outputs.prefixe }}/portail-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image de l'application
        uses: docker/build-push-action@v6
        with:
          context: exo2-portail-depot
          file: exo2-portail-depot/backend/Dockerfile
          push: true
          tags: ${{ steps.metadonnees.outputs.tags }}
          labels: ${{ steps.metadonnees.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Etiquettes du front
        id: metadonnees_front
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.noms.outputs.prefixe }}/portail-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image du front
        uses: docker/build-push-action@v6
        with:
          context: exo2-portail-depot
          file: exo2-portail-depot/frontend/Dockerfile
          push: true
          tags: ${{ steps.metadonnees_front.outputs.tags }}
          labels: ${{ steps.metadonnees_front.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
