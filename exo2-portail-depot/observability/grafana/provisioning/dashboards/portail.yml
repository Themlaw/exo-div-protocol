apiVersion: 1

providers:
  - name: portail
    type: file
    # Le tableau de bord vit dans le depot, pas dans la base de Grafana : il se
    # relit, se compare et se corrige comme du code.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
