# Surcouche de DEVELOPPEMENT uniquement.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Elle n'est jamais deployee : `install.sh` n'utilise que le fichier de base.
# Le nom n'est volontairement pas `docker-compose.override.yml`, qui serait
# charge automatiquement et pourrait relacher la production sans qu'on le voie.
#
# Ce qu'elle change, et ce que ca coute : elle attache Postgres et MinIO a un
# second reseau non interne pour que l'hote puisse les joindre. Ils y regagnent
# donc un acces sortant. C'est acceptable en local, ou le modele de menace n'est
# pas celui du serveur partage — mais c'est bien une protection en moins.

services:
  postgres:
    networks:
      - datastore
      - hostaccess
    ports:
      # Jamais 0.0.0.0, meme en local : la machine de developpement est aussi
      # sur un reseau.
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  minio:
    environment:
      # L'API tourne sur l'HOTE en developpement, pas dans un conteneur `app` :
      # le nom de service de la production ne resout pas ici, et les
      # notifications resteraient indefiniment dans la file de MinIO.
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_portail: "http://host.docker.internal:${PORT:-3000}/internal/storage/events"
    extra_hosts:
      # Linux ne fournit pas `host.docker.internal` par defaut, contrairement a
      # Docker Desktop.
      - "host.docker.internal:host-gateway"
    networks:
      - datastore
      - hostaccess
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"

  clamav:
    networks:
      - datastore
      - hostaccess
      - signatures
    ports:
      # Le worker tourne sur l'HOTE en developpement : sans ce port, il n'a aucun
      # moyen de joindre clamd et tout scan repondrait `scanner_unavailable`.
      - "127.0.0.1:${CLAMAV_PORT}:3310"

networks:
  hostaccess:
    driver: bridge
