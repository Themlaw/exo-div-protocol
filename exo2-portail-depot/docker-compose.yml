# Durcissement applique a tous les services : on part du principe qu'un attaquant
# finira dans un conteneur, et on cherche a ce qu'il n'y trouve rien a faire.
#
# Chaque service tourne en 1000:1000 (jamais root), avec un systeme de fichiers
# racine en lecture seule, toutes les capabilities Linux retirees, et l'interdiction
# d'acquerir de nouveaux privileges — ce qui neutralise l'escalade par binaire suid.
#
# Les repertoires de ./data doivent appartenir a 1000:1000 AVANT le premier
# demarrage : un volume nomme serait cree root et le conteneur non-root ne
# pourrait pas y ecrire. C'est install.sh qui les cree avec le bon proprietaire.

name: portail-depot

services:
  postgres:
    # Version epinglee au correctif : `17-alpine` glisserait d'un `docker pull` a l'autre.
    image: postgres:17.11-alpine
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Sous-repertoire explicite : initdb refuse un repertoire de donnees
      # contenant deja quoi que ce soit, y compris un point de montage.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    tmpfs:
      # Les seuls chemins que Postgres doit ecrire hors de PGDATA. `noexec` et
      # `nosuid` empechent d'y deposer puis d'y executer un binaire.
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      # Postgres ne touche QUE `datastore`. Il n'est joignable par rien d'autre
      # que l'application et le worker, et Traefik lui-meme ne peut pas l'atteindre.
      - datastore

  minio:
    # Dernier RELEASE publie. Jamais `latest` : l'image du serveur doit etre
    # exactement celle qu'on a testee en local.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Le navigateur poste les octets DIRECTEMENT ici : sans autorisation
      # d'origine, le POST pre-signe est bloque par le navigateur et l'upload
      # direct ne marche pas du tout. Une seule origine, celle du portail —
      # `*` autoriserait n'importe quelle page a poster avec une policy volee.
      # Le client JS de MinIO n'expose pas `setBucketCors` : la configuration
      # se fait donc ici, cote serveur, et non depuis l'application.
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_BASE_URL}
      # Cible de notification `portail`, d'ou l'ARN `arn:minio:sqs::portail:webhook`
      # auquel l'application abonne la quarantaine au demarrage. Sans elle, MinIO
      # refuserait l'abonnement et aucun scan ne partirait a l'arrivee d'un objet.
      MINIO_NOTIFY_WEBHOOK_ENABLE_portail: "on"
      # HORS du prefixe versionne, et c'est voulu : les sondes et ce webhook sont
      # des surfaces d'exploitation, pas l'API du produit. Un passage en v2
      # casserait sinon la notification MinIO pour aucun benefice. Le chemin est
      # celui de ROUTES_SERVED_OUTSIDE_THE_VERSIONED_API.
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_portail: "http://app:${PORT:-3000}/internal/storage/events"
      # Le meme secret que l'application attend en en-tete Authorization : MinIO
      # ne signe pas le corps de ses notifications, ce jeton est la seule preuve
      # que l'appel vient bien du stockage.
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_portail: ${INTERNAL_STORAGE_WEBHOOK_SECRET}
      # File sur disque : une notification emise pendant que l'API redemarre est
      # gardee et rejouee, au lieu d'etre perdue. Sans elle, MinIO exige aussi que
      # la cible reponde des SON demarrage, ce qui rendrait l'ordre de lancement
      # des services significatif.
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_portail: /data/.notifications
      MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT_portail: "10000"
    volumes:
      - ./data/minio:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - datastore
      # MinIO doit etre joignable par le NAVIGATEUR : on a choisi l'upload
      # pre-signe direct, les octets ne passent pas par l'API. Il rejoint donc
      # `proxied` pour que Traefik puisse le router — sans y gagner d'acces
      # sortant, puisque ce reseau est lui aussi interne.
      - proxied

  clamav:
    # clamd, joint en TCP par le worker. L'image officielle embarque deja un jeu
    # de signatures : le service repond des le premier demarrage, sans attendre
    # un telechargement.
    #
    # A SAVOIR AVANT DE DEPLOYER : clamd charge toute la base de signatures en
    # memoire et reclame environ 1,5 Go rien pour demarrer. Sur une VM plus
    # petite il est tue par le noyau, et le fail closed transforme alors chaque
    # depot en scan qui ne finit jamais.
    image: clamav/clamav:1.5.1
    restart: unless-stopped
    # SEULE exception au 1000:1000 de tous les autres services, et la regle
    # qu'elle sert reste tenue : ce n'est pas root. L'image cree ses repertoires
    # avec `install -o clamav -g clamav`, ce qu'aucun autre uid ne peut faire, et
    # elle embarque son propre compte non privilegie — le forcer a 1000
    # empechait simplement clamd de demarrer.
    user: "100:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Les signatures survivent au conteneur : sans persistance, chaque
      # redemarrage repartirait du jeu fige dans l'image et retelechargerait tout.
      #
      # Volume NOMME et non un bind sous ./data, contrairement a Postgres et
      # MinIO : Docker en herite le proprietaire du repertoire de l'image, donc
      # l'uid 100, la ou un bind exigerait un chown de l'hote. Le cout est
      # acceptable parce que ce contenu est un CACHE — il se retelecharge — et
      # non une donnee de client.
      - clamav_signatures:/var/lib/clamav
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m,uid=100,gid=101
      # Les journaux vont en memoire et disparaissent avec le conteneur : les
      # verdicts qui comptent sont ecrits par NOUS, dans nos propres journaux.
      # clamd refuse simplement de demarrer s'il ne peut pas ouvrir les siens.
      - /var/log/clamav:rw,noexec,nosuid,size=32m,uid=100,gid=101
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Le chargement des signatures prend une bonne minute : une fenetre courte
      # ferait redemarrer le service en boucle avant qu'il ait fini de demarrer.
      start_period: 180s
    networks:
      - datastore
      # SEUL service a sortir sur Internet, et c'est un choix assume : un
      # antivirus dont les signatures datent de l'image ne protege plus de
      # grand-chose. Il ne partage ce reseau avec personne, donc aucun autre
      # conteneur ne regagne d'acces sortant par ce biais.
      - signatures

  prometheus:
    # Majeure courante, epinglee au correctif comme tout le reste.
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Trente jours : de quoi comparer un incident a la semaine precedente sans
      # faire de ce conteneur un entrepot de donnees.
      - --storage.tsdb.retention.time=30d
      # PAS de --web.enable-lifecycle ni de --web.enable-admin-api : ils
      # ouvrent l'arret du service et l'effacement des series a qui atteint le
      # port. Rien ici n'a besoin de recharger a chaud.
      - --web.listen-address=:9090
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # Le secret de collecte n'est jamais dans un fichier versionne : install.sh
      # l'ecrit a partir de l'environnement, avec les droits 0400.
      - ./data/observability/secrets:/etc/prometheus/secrets:ro
      - ./data/prometheus:/prometheus
    networks:
      # UNIQUEMENT le reseau d'observabilite. Le collecteur n'a aucune raison
      # d'atteindre Postgres ni clamav, et le lui interdire supprime la question.
      - observability

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Genere aleatoirement par install.sh, comme tous les autres secrets.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Aucune inscription, aucun acces anonyme : le tableau de bord dit le
      # rythme des depots et celui des refus, ce n'est pas une page publique.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana genere ses liens absolus a partir de cette valeur : sans elle,
      # une connexion derriere le proxy renvoie vers localhost.
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Le conteneur n'a aucun acces sortant (reseau interne) : lui demander
      # d'aller chercher des mises a jour ou des greffons ne ferait qu'echouer
      # bruyamment a chaque demarrage.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Grafana 12 pre-installe trois greffons depuis grafana.com au demarrage.
      # Sans acces sortant, ce sont quatre erreurs a CHAQUE boot — et un
      # conteneur qui crie tous les matins apprend a tout le monde a ne plus
      # lire ses journaux.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - observability
      # Rejoint `proxied` pour que Traefik le serve en HTTPS. Une stack
      # d'alerting qu'on ne peut pas montrer ne prouve rien — mais elle reste
      # derriere l'authentification de Grafana, jamais anonyme.
      - proxied

volumes:
  clamav_signatures:

networks:
  # Seul Traefik sera attache a `edge`. C'est ce qui fait de lui le pont unique
  # vers l'exterieur : les services qu'il route restent sur des reseaux internes
  # et n'ont, eux, aucun acces sortant.
  edge:
    driver: bridge

  # Traefik + les services publiquement routes (application, MinIO).
  # `internal: true` : porter du trafic conteneur a conteneur n'exige pas de
  # passerelle. Traefik atteint ces services, eux n'atteignent pas Internet.
  proxied:
    internal: true

  # Reserve a clamav, pour freshclam et rien d'autre.
  signatures:
    driver: bridge

  # Le collecteur, le tableau de bord, et les cibles qu'ils interrogent. Separe
  # de `datastore` pour que l'observabilite ne devienne pas un chemin de plus
  # vers la base : Prometheus n'a besoin que des deux processus du portail.
  observability:
    internal: true

  datastore:
    # `internal: true` coupe tout acces sortant vers Internet. Ni Postgres ni
    # MinIO n'ont de raison d'appeler l'exterieur ; leur en retirer le moyen
    # supprime l'exfiltration directe depuis un conteneur compromis.
    #
    # Consequence a connaitre : Docker **ne peut pas publier de port** pour un
    # conteneur attache au seul reseau interne — il n'y a ni passerelle ni NAT —
    # et il ignore la directive `ports` en silence. Aucun port n'est donc publie
    # ici. Pour un acces depuis l'hote en developpement, utiliser
    # `docker-compose.dev.yml`.
    internal: true

# Topologie a l'arrivee des services restants :
#
#   traefik    -> edge + proxied                 (seul pont vers l'exterieur)
#   app        -> proxied + datastore + observability
#   worker     -> datastore + observability      (jamais expose, meme via Traefik :
#                                                 son port de metriques n'est joignable
#                                                 que par le collecteur)
#   clamav     -> datastore + signatures         (joignable par le worker, sort pour freshclam)
#   minio      -> proxied + datastore            (routable, car upload direct navigateur)
#   postgres   -> datastore                      (joignable par rien d'autre)
#   prometheus -> observability                  (ne voit ni la base ni le scanner)
#   grafana    -> observability + proxied        (route par Traefik, authentifie)
